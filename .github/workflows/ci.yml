name: SAM CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
  # The control-channel negative tests on Windows. The full suite is
  # not green there yet (checkout turns the reserved engine.ts probe
  # lines into CRLF, and a few path tests assume a Linux host), so
  # this job runs only the daemon suites, which are the ones that
  # exercise the pipe.
  daemon-control:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --test dist/daemon.test.js dist/daemon-auth.test.js
